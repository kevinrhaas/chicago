<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human variation lineup</title><link rel="icon" href="data:,">
<!-- T-3412: a test page, served from chicago/4d and never published. It stands N people side by
     side in one asset, each with their own seeded body and face from the shared MakeHuman delta
     kit (renderers/web/js/human-variation.js), so a reviewer sees that no two are alike.
     ?asset=bardwell_otis_1835&lod=0&n=6&scope=full&view=body|faces&keys=a,b,c&clip=idle_natural_v1
     A key that names a person in assets/humans/web/hm08_variation_persons.json takes their record (age, a face
     fitted to a portrait). &bg=#rrggbb sets the backdrop, &labels=0 hides the names, and
     &aim=head points a faces view at the first figure's head bone (T-3413's portrait pairs). -->
<style>html,body{margin:0;height:100%;background:#d9d6cf;overflow:hidden;font:12px system-ui}canvas{display:block;width:100%;height:100%}
#labels{position:fixed;left:0;right:0;bottom:6px;display:flex;justify-content:space-around;pointer-events:none;color:#333}</style>
<script type="importmap">{"imports":{
  "three":"../renderers/web/vendor/three-0.185.1/three.module.js",
  "three/addons/":"../renderers/web/vendor/three-0.185.1/addons/"}}</script>
</head><body><div id="labels"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';
import { loadMeshoptDecoder } from '../renderers/web/js/scene-loader.js';
import { loadVariationKit, personVariation, applyVariation } from '../renderers/web/js/human-variation.js';
import { dressSkin, restingLid } from '../renderers/web/js/human-skin.js';
import { dressHair, dressHeadcloth } from '../renderers/web/js/human-hair.js';
import { dressLooks, dressCloth, looksHairStyle } from '../renderers/web/js/human-looks.js';
import { dressHat } from '../renderers/web/js/human-hats.js';
import { hairFor } from '../renderers/web/js/human-hair-styles.js';
import { dressSpectacles } from '../renderers/web/js/human-spectacles.js';
import { fitWaist } from '../renderers/web/js/human-waist.js';
import { engraveSilver } from '../renderers/web/js/human-silver.js';

const q = new URLSearchParams(location.search);
const asset = q.get('asset') ?? 'bardwell_otis_1835', lod = Number(q.get('lod') ?? 0);
const scope = q.get('scope') ?? 'full', view = q.get('view') ?? 'body';
const keys = q.get('keys')?.split(',') ?? Array.from({ length: Number(q.get('n') ?? 6) }, (_, i) => `lineup_${i + 1}`);
const kit = await loadVariationKit(new URL('../assets/humans/web/', location.href));
const persons = (await fetch('../assets/humans/web/hm08_variation_persons.json').then((r) => r.json())).persons;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(q.get('bg') ?? '#d9d6cf');
if (q.get('labels') === '0') document.getElementById('labels').style.display = 'none';
if (q.get('dress') === '1') {
  // Dressed (T-3440): the town's look, as tools/human_skin_portrait.html lights it: ACES, a sky
  // fill from above and warm ground below, and a low sun from the front left.
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
  const pm = new THREE.PMREMGenerator(renderer), sky = new THREE.Scene(), g = new THREE.SphereGeometry(10, 32, 16), col = [];
  const top = new THREE.Color(0x7fa6d6), mid = new THREE.Color(0xd8dde2), low = new THREE.Color(0x6b5a44);
  for (let i = 0; i < g.attributes.position.count; i++) { const y = g.attributes.position.getY(i) / 10; const c = y > 0 ? mid.clone().lerp(top, y) : mid.clone().lerp(low, Math.min(1, -y * 3)); col.push(c.r, c.g, c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  sky.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  scene.environment = pm.fromScene(sky, .02).texture;
  const sun = new THREE.DirectionalLight(0xfff2dc, Number(q.get('sun') ?? 2.6)); sun.position.set(-1.6, 3.4, 3.2); scene.add(sun);
} else {
  scene.add(new THREE.HemisphereLight(0xf2efe8, 0x6b6253, 1.4));
  const sun = new THREE.DirectionalLight(0xfff4e2, 2.4); sun.position.set(2, 4, 5); scene.add(sun);
}
const loader = new GLTFLoader().setMeshoptDecoder(await loadMeshoptDecoder());
// &asset=auto (T-3522): each key in the body its drawn instance wears.
const assetOf = async (key) => {
  if (asset !== 'auto') return asset;
  const inst = persons[key]?.drawn_as?.[0];
  return inst ? (await fetch(`../${inst}`).then((r) => r.json())).appearance.asset_id : 'settler_1812';
};
const gltfs = new Map();
// As humans.js parses a body (T-3553: the belted waist refitted and the silver engraved, once, before any clone); &waist=0 leaves both as drawn.
const gltfFor = async (a) => {
  if (!gltfs.has(a)) { const g = await loader.loadAsync(`../assets/humans/web/${a}.lod${lod}.glb`); if (q.get('waist') !== '0') { window.__waist = fitWaist(g.scene); engraveSilver(g.scene); } gltfs.set(a, g); }
  return gltfs.get(a);
};
const bodyOf = new Map();
for (const key of keys) bodyOf.set(key, await assetOf(key));
const gltf = await gltfFor(bodyOf.get(keys[0]));
for (const key of keys) await gltfFor(bodyOf.get(key));
const clipName = q.get('clip') ?? (gltf.animations.find((a) => /idle/.test(a.name)) ?? gltf.animations[0])?.name;
const gap = view === 'faces' ? 0.36 : 0.75;
const labels = document.getElementById('labels');
const mixers = [];
keys.forEach((key, i) => {
  const own = gltfs.get(bodyOf.get(key));
  const fig = cloneSkinned(own.scene);
  const record = key === 'base' ? null : persons[key] ?? null;
  if (key !== 'base') {
    const v = personVariation({ kit, key, record, assetId: bodyOf.get(key), sceneYear: Number(record?.scene) || null });
    const r = applyVariation(fig, kit, v, { scope });
    window.__variations = [...(window.__variations ?? []), { key, ...v, applied: r }];
  }
  // &dress=1 (T-3440): dressed as humans.js dresses a person in town: the skin, the person's
  // own hair and facial hair (human-hair-styles.js) and spectacles where they wear them.
  if (q.get('dress') === '1') {
    // T-3522: their looks, cloth, hat and headcloth, as humans.js build() puts them on.
    const rec = key === 'base' ? null : persons[key] ?? null, year = Number(q.get('year') ?? rec?.scene ?? 1904);
    if (rec?.looks) dressLooks(fig, rec.looks);
    if (rec?.dress) dressCloth(fig, rec.dress);
    dressSkin(fig, { age: window.__variations?.find((x) => x.key === key)?.age ?? null, person: key === 'base' ? null : key, year });
    const style = rec?.looks ? looksHairStyle(rec.looks, hairFor(key, year)) : null;
    if (style && rec?.dress?.tail_cm) style.tail_cm = rec.dress.tail_cm;
    const hair = dressHair(fig, { lod, person: key === 'base' ? null : key, year, style });
    if (rec?.dress?.headcloth) dressHeadcloth(fig, rec.dress.headcloth, { person: key });
    if (rec?.dress?.hat) dressHat(fig, rec.dress.hat, { person: key, lod });
    const specs = dressSpectacles(fig, { lod, person: key === 'base' ? null : key });
    window.__dressed = [...(window.__dressed ?? []), { key, hair: hair ? { cut: hair.style.cut, grown: hair.grown } : null, spectacles: !!specs }];
  }
  // &hide=hair: leave out meshes whose material names match (a bald portrait's still).
  // &blink=0..1 (T-3493): the eyes that far shut, on every mesh that takes the face's morphs.
  // Unset, a dressed face's lids rest where humans.js rests them for the person's age.
  const lid = q.get('blink') ? Number(q.get('blink')) : q.get('dress') === '1' ? restingLid(window.__variations?.find((x) => x.key === key)?.age) : 0;
  if (lid) fig.traverse((o) => { for (const k of ['eyeBlinkLeft', 'eyeBlinkRight']) if (o.morphTargetDictionary?.[k] !== undefined) o.morphTargetInfluences[o.morphTargetDictionary[k]] = lid; });
  if (q.get('hide')) { const re = new RegExp(q.get('hide')); fig.traverse((o) => { if (o.isMesh && re.test(o.material?.name ?? '')) o.visible = false; }); }
  const holder = new THREE.Group(); holder.add(fig);
  holder.position.x = (i - (keys.length - 1) / 2) * gap;
  scene.add(holder);
  const clip = own.animations.find((a) => a.name === clipName) ?? own.animations.find((a) => /idle/.test(a.name));
  if (clip) { const m = new THREE.AnimationMixer(fig); m.clipAction(clip).play(); m.setTime(Number(q.get('t') ?? 1)); mixers.push(m); }
  const label = document.createElement('div'); label.textContent = key; labels.appendChild(label);
});
const camera = new THREE.PerspectiveCamera(view === 'faces' ? 22 : 30, innerWidth / innerHeight, 0.05, 50);
const span = keys.length * gap;
const yaw = Number(q.get('yaw') ?? 0) * Math.PI / 180;
scene.traverse((o) => { if (o.parent === scene && o.isGroup) o.rotation.y = yaw; });
scene.updateMatrixWorld(true);
const headBone = q.get('aim') === 'head' ? scene.getObjectByName('head') : null;
if (headBone) {
  const h = headBone.getWorldPosition(new THREE.Vector3());
  const look = Number(q.get('look') ?? 0.07);   // how far above the head bone to aim, metres
  camera.position.set(h.x, h.y + look + 0.01, h.z + Number(q.get('dist') ?? 0.9)); camera.lookAt(h.x, h.y + look, h.z);
} else if (view === 'faces') { camera.position.set(0, 1.64, Math.max(1.2, span * 1.35)); camera.lookAt(0, 1.6, 0); }
else { camera.position.set(0, 1.0, Math.max(3.2, span * 1.6)); camera.lookAt(0, 0.92, 0); }
renderer.render(scene, camera);
window.__scene = scene;
window.__lineupReady = true;
</script></body></html>
