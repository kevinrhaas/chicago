name: Better Trees core — exact-profile current source calibration
permissions:
  contents: read
jobs:
  calibrated:
    name: core calibration allocation ${{ matrix.allocation }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        allocation:
        - 1
        - 2
        - 3
    env:
      DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_MANIFEST_SHA: b42c858331ce76457dcba526d4ef892ac5fcc0f6dcc09ce3ac336daaf6bf9d67
      REQUIRED_CPU: AMD EPYC 9V74 80-Core Processor
      SOURCE_RECEIPT_PATH: /tmp/calibrated-source-before.json
    steps:
    - name: Require the exact established CPU before source or timing
      run: 'python3 - <<''PYTHON''

        import json,os,subprocess

        from pathlib import Path

        cpu=next(line.split('':'',1)[1].strip() for line in Path(''/proc/cpuinfo'').read_text().splitlines()
        if line.startswith(''model name''))

        cores=int(subprocess.check_output([''nproc''],text=True).strip())

        eligible=cpu==os.environ[''REQUIRED_CPU''] and cores==4

        r={''cpu'':cpu,''cores'':cores,''calibrated'':eligible,''eligibilityOnly'':True,''required_cpu'':os.environ[''REQUIRED_CPU''],''required_cores'':4,''source_and_timing_not_started'':True}

        Path(''/tmp/calibrated-host.json'').write_text(json.dumps(r,indent=2)+''\n'');print(json.dumps(r))

        if not eligible:raise SystemExit(''This allocation is not the required established
        CPU profile; source/timing skipped'')

        PYTHON

        '
    - uses: actions/checkout@v4
      with:
        ref: 3bdf2349cf29f374833d015e91b84dab6611d636
        fetch-depth: 0
        filter: blob:none
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Apply and verify the frozen complete source
      run: 'python3 - <<''PYTHON''

        import hashlib,os,subprocess

        from pathlib import Path

        head=os.environ[''DIAGNOSTIC_HEAD''];subprocess.run([''git'',''fetch'',''--quiet'',''origin'',head],check=True)

        raw=subprocess.check_output([''git'',''show'',head+'':.github/diagnostics/t3747-verify-current-committed-source.py'']);assert
        hashlib.sha256(raw).hexdigest()==''c0bb0412bf5597af4c6c8888de9b054a9ae07cb891b0dfa45708581fceb60ba4''

        p=Path(''/tmp/t3747-apply-source.py'');p.write_bytes(raw);subprocess.run([''python3'',str(p)],check=True)

        PYTHON

        '
    - name: Install Playwright
      run: 'set -e

        npm install -g playwright@1.56.1

        node "$(npm root -g)/playwright/cli.js" install --with-deps chromium

        '
    - name: Install the publication schema validator
      run: python3 -m pip install --quiet --upgrade 'jsonschema>=4,<5'
    - name: Publish the mirror the gate serves (site/4d/ is generated)
      working-directory: chicago/4d
      run: bash tools/publish.sh
    - name: Hold the unchanged stock still-frame ceilings
      working-directory: chicago/4d
      run: '(cd ../.. && SOURCE_RECEIPT_PATH=/tmp/calibrated-source-after.json python3
        /tmp/t3747-apply-source.py --verify)

        node tools/measure_still_frame.mjs --gate --only desktop --json still-frame-desktop.json

        node tools/measure_still_frame.mjs --gate --only mobile --json still-frame-mobile.json

        (cd ../.. && SOURCE_RECEIPT_PATH=/tmp/calibrated-source-after.json python3
        /tmp/t3747-apply-source.py --verify)

        '
    - name: Keep every allocation, including unsupported and failed ones
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vegetation-core-dev072-calibration-${{ matrix.allocation }}
        path: '/tmp/calibrated-host.json

          /tmp/calibrated-source-before.json

          /tmp/calibrated-source-after.json

          chicago/4d/still-frame-desktop.json

          chicago/4d/still-frame-mobile.json'
        if-no-files-found: error
'on':
  workflow_dispatch: null
