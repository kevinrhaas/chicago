name: Chicago 4D — full smoke

# The renderer smoke on a runner WITHOUT the per-command ceiling.
#
# ROADMAP § THE RUN BUDGET, and T-0060: a steward run's single foreground
# command is capped at ten minutes, and by 2026-08-18 neither viewport's full
# unfiltered pass fit inside it. Steward runs verify with SMOKE_STAGE parts
# (each fits a command); THIS workflow is where an unfiltered pass lives — the
# reference measurement the halves are audited against, and the only place the
# whole gate runs as one process. Dispatch it on any ref, e.g.:
#
#   gh workflow run chicago-4d-smoke.yml --ref <branch> -f viewport=mobile
#
# It is dispatch-plus-one-path on purpose. The dev gate (chicago-4d-check.yml)
# stays ~90 s and advisory speed matters there; a ~25-minute-per-viewport
# Playwright crawl on every push would be a queue, not a gate (one path is not
# a queue). The nightly bake already smokes the mirror it publishes. The single push path makes the
# workflow self-testing — an edit to it runs the full unfiltered gate from the
# pushed ref — and is also the only way to run it on a branch at all, because
# workflow_dispatch resolves filenames on the default branch only.

on:
  push:
    paths:
      - '.github/workflows/chicago-4d-smoke.yml'
  workflow_dispatch:
    inputs:
      viewport:
        description: 'SMOKE_VIEWPORT — empty for both, or mobile / desktop'
        required: false
        default: ''
      stage:
        description: 'SMOKE_STAGE — empty for the full body, or a part 1..13 / a range like 3-4'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Both viewports, unfiltered, measured ~26 min in 2026-08-14 and the suite
    # has grown since; leave room rather than killing the measurement run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed GLOBALLY on purpose: smoke_renderer.mjs resolves it through
      # `npm root -g` (ESM does not honour NODE_PATH), same as the bake and
      # every other repo in the fleet. Chromium alone — the smoke drives
      # nothing else.
      - name: Install Playwright
        run: |
          set -e
          npm install -g playwright@1.56.1
          node "$(npm root -g)/playwright/cli.js" install --with-deps chromium

      # --published: the gate that matters runs against the mirror that ships,
      # compressed derivatives and visitor layout, not the source masters.
      - name: Run the smoke against the published mirror
        working-directory: chicago/4d
        env:
          SMOKE_VIEWPORT: ${{ inputs.viewport }}
          SMOKE_STAGE: ${{ inputs.stage }}
        run: node tools/smoke_renderer.mjs --published
