name: Chicago 4D — still-frame ceiling

# T-2111: the still-frame TIME ceiling per Scene detail tier at the worst 1835
# stand, beside T-1975's triangle ceilings (`DETAIL` in main.js). The numbers
# and the reading they were set on are in chicago/4d/tools/still_frame_ceilings.json;
# the gate is `tools/measure_still_frame.mjs --gate`, which reads them.
#
# NOT IN THE SMOKE, ON PURPOSE. One viewport's gate is ~5 minutes of software
# rasterising (three tiers at the worst stand, each a frame of seconds), and
# the smoke's parts are already packed under the 600 s a steward command gets.
# Its own workflow, one job per viewport, so neither waits on the other and a
# red names its viewport. T-2106's moving-frame gate is meant to sit beside it
# as another job here.
#
# T-2546: the MEMORY ceiling sits here too, for the same reason it is not in the
# smoke: a reading is a whole boot per year x viewport (35 s to 6 min each on the
# steward runner, ~17 min for all six). Its ceilings and the reading they were
# set on are in chicago/4d/tools/memory_ceilings.json; the gate is
# `tools/measure_memory.mjs --gate`, one job per year x viewport, and a
# self-test job proves it can go red (`--self-test`, ?keep-geometry=1).
#
# Nightly, by hand, and on any push that changes a gate, its ceilings or this
# file — so a PR that moves a ceiling is gated on the number it writes.

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chicago-4d-frame-time.yml'
      - 'chicago/4d/tools/measure_still_frame.mjs'
      - 'chicago/4d/tools/still_frame_ceilings.json'
      - 'chicago/4d/tools/measure_memory.mjs'
      - 'chicago/4d/tools/memory_ceilings.json'

jobs:
  still-frame:
    # T-3169: pinned — Playwright 1.56.1 cannot install chromium on ubuntu-26.04,
    # which `ubuntu-latest` became on 2026-10-26 (tools/check_runner_images.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Globally, as the smoke does: the tool falls back to `npm root -g`.
      - name: Install Playwright
        run: |
          set -e
          npm install -g playwright@1.56.1
          node "$(npm root -g)/playwright/cli.js" install --with-deps chromium

      # The mirror is generated (T-0938); the gate reads what ships.
      - name: Publish the mirror the gate serves (site/4d/ is generated)
        working-directory: chicago/4d
        run: bash tools/publish.sh

      - name: Hold the still-frame ceiling
        working-directory: chicago/4d
        run: node tools/measure_still_frame.mjs --gate --only ${{ matrix.viewport }} --json still-frame-${{ matrix.viewport }}.json

      - name: Keep the reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: still-frame-${{ matrix.viewport }}
          path: chicago/4d/still-frame-${{ matrix.viewport }}.json
          if-no-files-found: ignore

  memory:
    # T-3169: pinned — Playwright 1.56.1 cannot install chromium on ubuntu-26.04,
    # which `ubuntu-latest` became on 2026-10-26 (tools/check_runner_images.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        year: ['1812', '1835', '1904']
        viewport: [desktop, mobile]
        include:
          - year: '1835'
            viewport: self-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          set -e
          npm install -g playwright@1.56.1
          node "$(npm root -g)/playwright/cli.js" install --with-deps chromium

      - name: Publish the mirror the gate serves (site/4d/ is generated)
        working-directory: chicago/4d
        run: bash tools/publish.sh

      - name: Hold the memory ceiling
        if: matrix.viewport != 'self-test'
        working-directory: chicago/4d
        run: node tools/measure_memory.mjs --gate --year ${{ matrix.year }} --only ${{ matrix.viewport }} --json memory-${{ matrix.year }}-${{ matrix.viewport }}.json

      # The gate shown able to go red: every page array kept must read over 1835's phone ceiling.
      - name: Self-test the memory gate
        if: matrix.viewport == 'self-test'
        working-directory: chicago/4d
        run: node tools/measure_memory.mjs --self-test --json memory-${{ matrix.year }}-${{ matrix.viewport }}.json

      - name: Keep the reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.year }}-${{ matrix.viewport }}
          path: chicago/4d/memory-${{ matrix.year }}-${{ matrix.viewport }}.json
          if-no-files-found: ignore
