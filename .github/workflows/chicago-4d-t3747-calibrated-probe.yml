name: Better Trees core — current Dev149 working source
permissions:
  contents: read
jobs:
  native-working-source:
    name: Native working source ${{ matrix.part }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
        - part: 1/8
          serial: false
          key: 1of8
        - part: 2/8
          serial: false
          key: 2of8
        - part: 3/8
          serial: false
          key: 3of8
        - part: 4/8
          serial: false
          key: 4of8
        - part: 5/8
          serial: false
          key: 5of8
        - part: 6/8
          serial: false
          key: 6of8
        - part: 7/16
          serial: true
          key: 7of16
        - part: 15/16
          serial: false
          key: 15of16
        - part: 8/8
          serial: false
          key: 8of8
    env:
      DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_MANIFEST_SHA: 0d476f924c2ae3f845c377f9ba67f07fb986f5cfb0f8c042bf03e899d80edb16
      NATIVE_PART: ${{ matrix.part }}
      SOURCE_RECEIPT_PATH: /tmp/native-source-before.json
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 14960ef3cb774a43dd0f5992a28cb973e8be3d20
        fetch-depth: 0
        filter: blob:none
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install the full required native readers
      run: pip install --quiet jsonschema pyproj openpyxl pypdf numpy scipy Pillow
    - name: Read actual runner cores
      id: cores
      run: echo "n=$(nproc)" >> "$GITHUB_OUTPUT"
    - name: Apply and verify the frozen complete working source
      run: 'python3 - <<''PYTHON''

        import hashlib,os,re,subprocess

        from pathlib import Path

        head=os.environ[''DIAGNOSTIC_HEAD''];assert re.fullmatch(''[0-9a-f]{40}'',head)

        subprocess.run([''git'',''fetch'',''--quiet'',''origin'',head],check=True)

        raw=subprocess.check_output([''git'',''show'',head+'':.github/diagnostics/t3747-dev149-apply-working-source.py''])

        assert hashlib.sha256(raw).hexdigest()==''bdf504408a7676d3b4b0997be5d5ef1c5dea78a04b5c7f767ae2ec27bc66682e''

        p=Path(''/tmp/t3747-apply-source.py'');p.write_bytes(raw)

        subprocess.run([''python3'',str(p)],check=True)

        PYTHON

        '
    - name: Run the unchanged native gate and verify source stability
      env:
        C4D_GATE_REQUIRE_READERS: '1'
        C4D_GATE_REQUIRE_BASE: '1'
        CHECK_JOBS: ${{ matrix.serial && '1' || steps.cores.outputs.n }}
      run: 'set +e

        (cd chicago/4d && timeout --kill-after=5s 900s ./tools/check.sh --part "${{
        matrix.part }}") > /tmp/native-part.log 2>&1

        native_status=$?

        set -e

        SOURCE_RECEIPT_PATH=/tmp/native-source-after.json python3 /tmp/t3747-apply-source.py
        --verify

        cat /tmp/native-part.log

        exit "$native_status"

        '
    - name: Keep the complete native log and exact before/after source receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-working-${{ matrix.key }}
        path: '/tmp/native-part.log

          /tmp/native-source-before.json

          /tmp/native-source-after.json

          '
        if-no-files-found: error
  native-complete:
    name: Complete Native on the exact working source
    needs:
    - native-working-source
    if: always()
    runs-on: ubuntu-22.04
    steps:
    - run: test "${{ needs.native-working-source.result }}" = success
'on':
  pull_request:
    branches:
    - diagnostic/t3747-held-source-base
    paths:
    - .github/workflows/chicago-4d-t3747-calibrated-probe.yml
  workflow_dispatch: null
