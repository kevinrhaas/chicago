name: Better Trees — exact working-source validation

# Temporary diagnostic only. Owner-visible PR targets the held feature branch.
# Exact full working source before app authorship.
# Stock calibration and the complete native partition run independently; retain failures.
# Real CPU eligibility precedes asset downloads. Never merge this diagnostic.
on:
  pull_request:
    branches: [steward/t3747-vegetation-realism]
    paths: ['.github/workflows/chicago-4d-t3747-calibrated-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filter: blob:none
          sparse-checkout: .github/diagnostics
      - name: Verify the source manifest and every native partition residue
        id: plan
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os
          from pathlib import Path
          raw=Path('.github/diagnostics/t3747-original-current-source.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='a0c78fd4d5433841bc49e7005b541ead9f313a60a340a39f330fea1c3d019971'
          m=json.loads(raw);assert m['role']=='complete-uncommitted-feature' and m['qualifies_feature_candidate']
          assert len(m['source_sha256'])==28 and all(p.startswith('chicago/4d/') for p in m['source_sha256'])
          plan=m['native_matrix']
          for r in range(32):
            assert sum(r%int(x['part'].split('/')[1])==int(x['part'].split('/')[0])-1 for x in plan)==1
          serial=[x for x in plan if x['serial']];assert len(serial)==1
          k,n=map(int,serial[0]['part'].split('/'));assert (m['drape_ordinal']-1)%n==k-1
          matrix={'include':[{**x,'key':x['part'].replace('/','of')} for x in plan]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(matrix)+'\n')
          print(json.dumps({'sourceBase':m['base_dev'],'candidateTree':m['candidate_tree'],'sourcePaths':len(m['source_sha256']),'matrix':matrix,'coverage':'all32 exactly once','noAppCommitAuthored':True}))
          PYTHON

  calibrated-desktop:
    needs: source-plan
    env:
      DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_a0c78fd4d5433841bc49e7005b541ead9f313a60a340a39f330fea1c3d019971: a0c78fd4d5433841bc49e7005b541ead9f313a60a340a39f330fea1c3d019971
    # T-3169: pinned — Playwright 1.56.1 cannot install chromium on ubuntu-26.04,
    # which `ubuntu-latest` became on 2026-10-26 (tools/check_runner_images.py).
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67761214056dd916555d11cedf8c1a04c971b447
          filter: blob:none
          sparse-checkout: |
            .github
            chicago/4d/tools

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require a real calibrated desktop CPU before measuring
        env:
          SOURCE_HEAD: 67761214056dd916555d11cedf8c1a04c971b447
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const { execFileSync } = require('node:child_process');
          const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const appTree = execFileSync('git', ['rev-parse', 'HEAD:chicago/4d'], { encoding: 'utf8' }).trim();
          const cpu = os.cpus()[0].model.trim(), cores = os.cpus().length;
          const limits = JSON.parse(fs.readFileSync('chicago/4d/tools/still_frame_ceilings.json', 'utf8'));
          const machine = limits.machines.find(m => m.cpu === cpu && m.cores === cores);
          const calibrated = ['full', 'balanced', 'light'].every(t => typeof machine?.tiers[t]?.desktop === 'number');
          const reading = { source, appTree, cpu, cores, calibrated, tiers: machine?.tiers, eligibilityOnly: true };
          fs.writeFileSync('chicago/4d/calibrated-host.json', JSON.stringify(reading, null, 2) + '\n');
          console.log(JSON.stringify(reading));
          if (source !== process.env.SOURCE_HEAD) throw new Error('Unexpected app source');
          if (!calibrated) throw new Error('This runner has no stock desktop calibration; no timing verdict is possible');
          NODE

      # Publish reads the app, two sibling browsers and the production site.
      # Keep their complete native inputs; unrelated app research archives need
      # not consume the measurement job's existing 25-minute wall-time budget.
      - name: Materialize the complete native publication inputs
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, subprocess
          names = subprocess.check_output([
              'git', 'ls-tree', '-z', '-d', '--name-only', 'HEAD:chicago/4d'
          ]).split(b'\0')
          directories = {name for name in names if name}
          if not {b'assets', b'data', b'generators', b'tools', b'renderers'} <= directories:
              raise SystemExit('Native publication directories cannot be established')
          paths = ['.github', 'chicago/4d/docs/RESEARCH/glessner-v4-recovery',
                   'chicago/pre_fire_v1', 'chicago/prairie_1904_v1', 'site']
          paths += ['chicago/4d/' + os.fsdecode(name)
                    for name in sorted(directories) if name != b'docs']
          subprocess.run(['git', 'sparse-checkout', 'set', '--cone', *paths], check=True)
          PYTHON


      - name: Apply and verify the frozen complete working source
        run: |
          python3 - <<'PYTHON'
          import hashlib,os,re,subprocess
          from pathlib import Path
          head=os.environ['DIAGNOSTIC_HEAD'];assert re.fullmatch('[0-9a-f]{40}',head)
          subprocess.run(['git','fetch','--quiet','origin',head],check=True)
          raw=subprocess.check_output(['git','show',head+':.github/diagnostics/t3747-apply-original-working-source.py'])
          assert hashlib.sha256(raw).hexdigest()=='0a4800db5e5d3fa292f8ea6518d7ead8a368551fe321c8c74044cff0000cd26c'
          p=Path('/tmp/t3747-apply-source.py');p.write_bytes(raw)
          subprocess.run(['python3',str(p)],check=True)
          PYTHON

      # Globally, as the smoke does: the tool falls back to `npm root -g`.
      - name: Install Playwright
        run: |
          set -e
          npm install -g playwright@1.56.1
          node "$(npm root -g)/playwright/cli.js" install --with-deps chromium

      - name: Install the publication schema validator
        run: python3 -m pip install --quiet --upgrade 'jsonschema>=4,<5'

      # The mirror is generated (T-0938); the gate reads what ships.
      - name: Publish the mirror the gate serves (site/4d/ is generated)
        working-directory: chicago/4d
        run: bash tools/publish.sh

      - name: Hold the still-frame ceiling
        working-directory: chicago/4d
        run: |
          (cd ../.. && python3 /tmp/t3747-apply-source.py --verify)
          node tools/measure_still_frame.mjs --gate --only ${{ matrix.viewport }} --json still-frame-${{ matrix.viewport }}.json

      - name: Keep the reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: still-frame-${{ matrix.viewport }}
          path: |
            chicago/4d/still-frame-${{ matrix.viewport }}.json
            chicago/4d/calibrated-host.json
            chicago/4d/calibrated-source.json
          if-no-files-found: ignore


  native-working-source:
    name: Native working source ${{ matrix.part }}
    needs: source-plan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.source-plan.outputs.matrix) }}
    env:
      DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_a0c78fd4d5433841bc49e7005b541ead9f313a60a340a39f330fea1c3d019971: a0c78fd4d5433841bc49e7005b541ead9f313a60a340a39f330fea1c3d019971
      NATIVE_PART: ${{ matrix.part }}
      SOURCE_RECEIPT_PATH: /tmp/native-source-before.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 67761214056dd916555d11cedf8c1a04c971b447
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the full required native readers
        run: pip install --quiet jsonschema pyproj openpyxl pypdf numpy scipy Pillow
      - name: Read actual runner cores
        id: cores
        run: echo "n=$(nproc)" >> "$GITHUB_OUTPUT"
      - name: Apply and verify the frozen complete working source
        run: |
          python3 - <<'PYTHON'
          import hashlib,os,re,subprocess
          from pathlib import Path
          head=os.environ['DIAGNOSTIC_HEAD'];assert re.fullmatch('[0-9a-f]{40}',head)
          subprocess.run(['git','fetch','--quiet','origin',head],check=True)
          raw=subprocess.check_output(['git','show',head+':.github/diagnostics/t3747-apply-original-working-source.py'])
          assert hashlib.sha256(raw).hexdigest()=='0a4800db5e5d3fa292f8ea6518d7ead8a368551fe321c8c74044cff0000cd26c'
          p=Path('/tmp/t3747-apply-source.py');p.write_bytes(raw)
          subprocess.run(['python3',str(p)],check=True)
          PYTHON

      - name: Run the unchanged native gate and verify source stability
        env:
          C4D_GATE_REQUIRE_READERS: '1'
          C4D_GATE_REQUIRE_67761214056dd916555d11cedf8c1a04c971b447: '1'
          CHECK_JOBS: ${{ matrix.serial && '1' || steps.cores.outputs.n }}
        run: |
          set +e
          (cd chicago/4d && timeout --kill-after=5s 900s ./tools/check.sh --part "${{ matrix.part }}") > /tmp/native-part.log 2>&1
          native_status=$?
          set -e
          SOURCE_RECEIPT_PATH=/tmp/native-source-after.json python3 /tmp/t3747-apply-source.py --verify
          cat /tmp/native-part.log
          exit "$native_status"
      - name: Keep the complete native log and exact before/after source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-working-${{ matrix.key }}
          path: |
            /tmp/native-part.log
            /tmp/native-source-before.json
            /tmp/native-source-after.json
          if-no-files-found: error

  native-complete:
    name: Complete Native on the exact working source
    needs: [source-plan, native-working-source]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - run: test "${{ needs.native-working-source.result }}" = success
