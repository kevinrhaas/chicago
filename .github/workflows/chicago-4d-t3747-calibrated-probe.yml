name: Better Trees — calibrated desktop diagnostic

# Temporary diagnostic only. Owner-visible PR targets the held feature branch.
# The exact complete uncommitted current-Dev feature is a frozen patch/manifest.
# All28source hashes and full candidate tree must match before stock timing.
# Real CPU eligibility precedes asset downloads. Never merge this diagnostic.
on:
  pull_request:
    branches: [steward/t3747-vegetation-realism]
    paths: ['.github/workflows/chicago-4d-t3747-calibrated-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrated-desktop:
    # T-3169: pinned — Playwright 1.56.1 cannot install chromium on ubuntu-26.04,
    # which `ubuntu-latest` became on 2026-10-26 (tools/check_runner_images.py).
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d7eea18c028f527981fb633d1ab9dbfbb96460d
          filter: blob:none
          sparse-checkout: |
            .github
            chicago/4d/tools

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require a real calibrated desktop CPU before measuring
        env:
          SOURCE_HEAD: 2d7eea18c028f527981fb633d1ab9dbfbb96460d
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const { execFileSync } = require('node:child_process');
          const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const appTree = execFileSync('git', ['rev-parse', 'HEAD:chicago/4d'], { encoding: 'utf8' }).trim();
          const cpu = os.cpus()[0].model.trim(), cores = os.cpus().length;
          const limits = JSON.parse(fs.readFileSync('chicago/4d/tools/still_frame_ceilings.json', 'utf8'));
          const machine = limits.machines.find(m => m.cpu === cpu && m.cores === cores);
          const calibrated = ['full', 'balanced', 'light'].every(t => typeof machine?.tiers[t]?.desktop === 'number');
          const reading = { source, appTree, cpu, cores, calibrated, tiers: machine?.tiers, eligibilityOnly: true };
          fs.writeFileSync('chicago/4d/calibrated-host.json', JSON.stringify(reading, null, 2) + '\n');
          console.log(JSON.stringify(reading));
          if (source !== process.env.SOURCE_HEAD) throw new Error('Unexpected app source');
          if (!calibrated) throw new Error('This runner has no stock desktop calibration; no timing verdict is possible');
          NODE

      # Publish reads the app, two sibling browsers and the production site.
      # Keep their complete native inputs; unrelated app research archives need
      # not consume the measurement job's existing 25-minute wall-time budget.
      - name: Materialize the complete native publication inputs
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, subprocess
          names = subprocess.check_output([
              'git', 'ls-tree', '-z', '-d', '--name-only', 'HEAD:chicago/4d'
          ]).split(b'\0')
          directories = {name for name in names if name}
          if not {b'assets', b'data', b'generators', b'tools', b'renderers'} <= directories:
              raise SystemExit('Native publication directories cannot be established')
          paths = ['.github', 'chicago/4d/docs/RESEARCH/glessner-v4-recovery',
                   'chicago/pre_fire_v1', 'chicago/prairie_1904_v1', 'site']
          paths += ['chicago/4d/' + os.fsdecode(name)
                    for name in sorted(directories) if name != b'docs']
          subprocess.run(['git', 'sparse-checkout', 'set', '--cone', *paths], check=True)
          PYTHON


      - name: Apply and verify the frozen complete current-source candidate
        env:
          DIAGNOSTIC_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          head=os.environ['DIAGNOSTIC_HEAD']
          assert re.fullmatch('[0-9a-f]{40}',head)
          subprocess.run(['git','fetch','--quiet','origin',head],check=True)
          def show(p):return subprocess.check_output(['git','show',head+':'+p])
          raw=show('.github/diagnostics/t3747-physical-source.json')
          assert hashlib.sha256(raw).hexdigest()=='e5259693375dcbdaf8801791c5e0f889c2671baf92ccc31bfe5047b71aebdee4'
          m=json.loads(raw);patch=show('.github/diagnostics/t3747-physical-source.patch')
          assert hashlib.sha256(patch).hexdigest()==m['patch_sha256']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==m['base_dev']
          subprocess.run(['git','sparse-checkout','add','chicago/4d/docs/measurements'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','HEAD']).strip()
          p=Path('/tmp/vegetation-physical-current.patch');p.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==m['candidate_tree']
          assert subprocess.check_output(['git','rev-parse',tree+':chicago/4d'],text=True).strip()==m['candidate_app_tree']
          assert set(subprocess.check_output(['git','diff','--cached','--name-only','HEAD'],text=True).splitlines())==set(m['source_sha256'])
          assert not subprocess.check_output(['git','diff','--name-only']).strip()
          for name,h in m['source_sha256'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==h,name
          for p,k in [('chicago/4d/tools/measure_still_frame.mjs','timing_helper_sha256'),('chicago/4d/tools/still_frame_ceilings.json','ceilings_sha256')]:assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==m[k]
          Path('/tmp/vegetation-physical-current-manifest.json').write_bytes(raw)
          reading={**m,'workflowHead':head,'candidateSourceIsWorkingTreePatch':True,'all28TrackedSourcePathsVerified':True,'noAuthoredAppCommit':True,'measurementRasterGeometryPopulationLimitsUnchanged':True}
          Path('chicago/4d/calibrated-source.json').write_text(json.dumps(reading,indent=2)+'\n')
          print(json.dumps({k:v for k,v in reading.items() if k!='source_sha256'}))
          PYTHON

      # Globally, as the smoke does: the tool falls back to `npm root -g`.
      - name: Install Playwright
        run: |
          set -e
          npm install -g playwright@1.56.1
          node "$(npm root -g)/playwright/cli.js" install --with-deps chromium

      - name: Install the publication schema validator
        run: python3 -m pip install --quiet --upgrade 'jsonschema>=4,<5'

      # The mirror is generated (T-0938); the gate reads what ships.
      - name: Publish the mirror the gate serves (site/4d/ is generated)
        working-directory: chicago/4d
        run: bash tools/publish.sh

      - name: Hold the still-frame ceiling
        working-directory: chicago/4d
        run: |
          python3 - <<'PYTHON'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('/tmp/vegetation-physical-current-manifest.json').read_text())
          for name,h in m['source_sha256'].items():assert hashlib.sha256(Path('../..',name).read_bytes()).hexdigest()==h,name
          PYTHON
          node tools/measure_still_frame.mjs --gate --only ${{ matrix.viewport }} --json still-frame-${{ matrix.viewport }}.json

      - name: Keep the reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: still-frame-${{ matrix.viewport }}
          path: |
            chicago/4d/still-frame-${{ matrix.viewport }}.json
            chicago/4d/calibrated-host.json
            chicago/4d/calibrated-source.json
          if-no-files-found: ignore

