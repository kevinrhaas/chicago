name: Site films — upload to the media host

# The public site's films (site/, chicago.polecat.live) are cut from the 4D app by
# chicago/4d/tools/site_films.mjs. They are too big to ship inside the Pages site: production
# carries the 4D tree plus ~191 MiB of other content under GitHub Pages' 1 GB, and the
# landing's share of that is spent (chicago/4d/docs/SITE-BUDGET.md § 19). So the MP4s live in
# site-films/ at the repository root, which deploy.yml never publishes, and this workflow
# copies them to the R2 media bucket the jaunt narration already uses
# (chicago/4d/tools/audio-hosting.json `public_base`), under site/films/.
#
# Every file name carries a hash of its bytes (`<id>.<sha8>.mp4`, written by
# chicago/4d/tools/site_films_ingest.mjs), so an upload is immutable and a re-cut film is a new
# name: site/js/films.js points at the exact file, and nothing on the host is ever overwritten.
# `aws s3 sync` uploads only the names the bucket lacks.
#
# NEEDS the narration workflow's R2 secrets (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_ENDPOINT). Without them it explains and stops green.
on:
  push:
    paths:
      - 'site-films/**'
      - '.github/workflows/chicago-site-films.yml'
  workflow_dispatch:

concurrency:
  group: chicago-site-films
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAVE_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ENDPOINT != '' }}
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ "$HAVE_R2" = true ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Site films need the R2 secrets R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY/R2_ENDPOINT (docs/AUDIO.md § Narration)."
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site-films/
            /site/js/films.js
            /chicago/4d/tools/audio-hosting.json
            /chicago/4d/data/narration/voices.json
      - name: Upload the films the bucket lacks
        if: steps.secrets.outputs.ok == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          bucket=$(node -e "console.log(JSON.parse(require('fs').readFileSync('chicago/4d/data/narration/voices.json','utf8')).bucket)")
          aws s3 sync site-films/ "s3://$bucket/site/films/" --endpoint-url "$R2_ENDPOINT" \
            --exclude '*' --include '*.mp4' --size-only \
            --content-type video/mp4 --cache-control "public, max-age=31536000, immutable" --only-show-errors
          echo "synced site-films/ to s3://$bucket/site/films/"
      - name: Verify every film site/js/films.js names is served
        if: steps.secrets.outputs.ok == 'true'
        run: |
          base=$(node -e "console.log(JSON.parse(require('fs').readFileSync('chicago/4d/tools/audio-hosting.json','utf8')).public_base)")
          fail=0
          for f in $(node -e "global.window={};require('./site/js/films.js');console.log(Object.values(window.CHICAGO_FILMS.files).join('\n'))"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 "${base}site/films/$f")
            echo "$code $f"
            case "$code" in 200|206) ;; *) fail=1 ;; esac
          done
          [ "$fail" = 0 ] || { echo "::error::a film named in site/js/films.js is not served"; exit 1; }
