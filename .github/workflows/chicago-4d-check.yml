name: Chicago 4D — gate
concurrency:
  group: chicago-4d-gate-${{ github.event_name == 'pull_request' && format('pr-{0}',
    github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check-part:
    name: gate part ${{ matrix.part }}/8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: blob:none
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install validator dependencies
      run: pip install --quiet jsonschema pyproj openpyxl pypdf numpy scipy Pillow
    - name: How many cores this runner has
      id: jobs
      run: echo "n=$(nproc)" >> "$GITHUB_OUTPUT"
    - name: Run the gate
      working-directory: chicago/4d
      env:
        C4D_GATE_REQUIRE_READERS: '1'
        C4D_GATE_REQUIRE_BASE: '1'
        CHECK_JOBS: ${{ steps.jobs.outputs.n }}
      run: timeout --kill-after=5s 900s ./tools/check.sh --part "${{ matrix.part }}/8"
    - name: Does this change carry a changelog entry?
      if: github.event_name == 'pull_request'
      run: 'node chicago/4d/tools/check-changelog-entry.mjs "${{ github.event.pull_request.base.sha
        }}" "${{ github.event.pull_request.head.sha }}"

        '
  gate:
    name: gate
    needs: check-part
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require every native part to pass
      env:
        PARTS_RESULT: ${{ needs.check-part.result }}
      run: test "$PARTS_RESULT" = success
'on':
  push:
    branches:
    - dev
    - main
    paths:
    - chicago/4d/**
    - chicago/reference/**
    - .github/workflows/**
  pull_request:
    paths:
    - chicago/4d/**
    - chicago/reference/**
    - .github/workflows/**
    branches:
    - dev
    - main
  workflow_dispatch: null
