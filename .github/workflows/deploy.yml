name: Deploy to GitHub Pages

# Static site — no build step in the usual sense. Publishes the curated site/
# folder — the chicago.polecat.live landing page, the pre-fire and rebuilding-1870s
# viewers, and the 4D app's generated mirror at site/4d/ — NOT the whole repo: the
# repo also holds the uncompressed GLB masters, the research dossiers and the
# reference corpus, which must stay OUT of the Pages artifact. Mirrors the Polecat
# platform deploy pattern (upload-pages-artifact path: site) — the fleet's
# single-deploy-authority convention.
#
# This repository was split out of kevinrhaas/custom on 2026-09-23 (the project
# used to be one tenant of that monorepo, at custom.polecat.live/chicago/). The
# custom domain is site/CNAME; custom.polecat.live/chicago/** now redirects here.
#
# TWO SITES, ONE TIER EACH (2026-11-13; chicago/4d/docs/PIPELINE.md):
#   chicago.polecat.live/4d/            production, THIS workflow, deployed only on
#                                       an owner promotion
#   dev.chicago.polecat.live/4d/dev/    the `dev` branch's preview, its own GitHub
#                                       Pages site, deployed by kevinrhaas/chicago-dev
# The preview used to be folded into this artifact at /4d/dev/. GitHub caps one
# Pages site at 1 GB, and production + preview + the landing films + the older
# viewers had reached it; every dev deploy also had to re-download the exact live
# production artifact to leave production untouched, and when that artifact expired
# the preview froze (2026-11-12 and again 2026-11-13). Now a dev push only asks
# kevinrhaas/chicago-dev to rebuild, and this artifact carries small pages at
# /4d/dev/ that send old links to the new address
# (.github/chicago-4d-dev-redirect.mjs).
#
# MAIN movement never changes production by itself. Production delivery requires
# a matching owner-promotion receipt and commit (chicago-4d-promote-to-prod.yml
# dispatches this workflow with mode=production); any other run deploys nothing.
#
# THE 4D TRIGGER IS `chicago/4d/**`, NOT ONLY `site/**` (T-0938). The published
# mirror `site/4d/` is untracked and generated — this job publishes it below — so a
# 4D change never touches `site/**`, and a `site/**`-only filter would make every
# 4D merge a silent no-deploy.
on:
  push:
    branches: [main, dev]
    paths:
      - 'site/**'
      - 'chicago/**'
      - '.github/workflows/deploy.yml'
      - '.github/chicago-4d-dev-redirect.mjs'
      - '.github/preserve_dev_only.py'
      - '.github/live-production.json'
  workflow_dispatch:
    inputs:
      mode:
        description: DEV preserves the exact live production artifact
        type: choice
        options: [dev, production]
        default: dev
      promotion_run_id:
        description: Required only for an explicit owner promotion
        type: string
        default: ''
      promoted_sha:
        description: Exact commit recorded by that owner promotion
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pages deployments can only run from main. The `github-pages` environment
  # carries a deployment-branch policy, so a deploy job on a dev ref is REJECTED
  # before a runner is even assigned — a 1-second failure with no steps and no
  # logs, which reads as "nothing ran" while the preview silently stays frozen at
  # the last main deploy. Inherited verbatim from the jobtracker pilot, which
  # paid for this lesson.
  #
  # A push to dev therefore does not deploy itself: it re-enters this workflow ON
  # MAIN, which rebuilds the whole artifact — production from main plus the /dev/
  # preview assembled from the dev ref. workflow_dispatch is a documented
  # GITHUB_TOKEN-triggerable event and the dispatched run is on main, so it never
  # re-dispatches itself.
  #
  # Since 2026-11-13 the preview is kevinrhaas/chicago-dev's own Pages site, so a dev
  # push asks THAT repository to rebuild. GITHUB_TOKEN cannot dispatch another
  # repository's workflow, so this uses CHICAGO_DEV_DISPATCH, a fine-grained token
  # with Actions: read and write on kevinrhaas/chicago-dev only. Without the secret,
  # or if the call fails, chicago-dev's own 15-minute schedule picks the push up, so
  # this step never fails the run.
  refresh-previews:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask kevinrhaas/chicago-dev to rebuild the dev preview
        env:
          GH_TOKEN: ${{ secrets.CHICAGO_DEV_DISPATCH }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::CHICAGO_DEV_DISPATCH is not set; kevinrhaas/chicago-dev's 15-minute schedule will pick up ${GITHUB_SHA::9}"
            exit 0
          fi
          gh workflow run deploy-dev-preview.yml --repo kevinrhaas/chicago-dev --ref main \
            -f reason="dev push ${GITHUB_SHA::9}" \
            || echo "::warning::dispatch to kevinrhaas/chicago-dev failed; its 15-minute schedule will pick up ${GITHUB_SHA::9}"

  deploy:
    # Pages deploys run from main ONLY (see refresh-previews above), and only for an
    # owner promotion: production is the one tier this site holds now, and nothing
    # else may change it. A push to main, or a dispatch without mode=production,
    # skips this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'production'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      DELIVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'production' && 'production' || 'dev' }}
      PROMOTION_RUN_ID: ${{ inputs.promotion_run_id || '' }}
      PROMOTED_SHA: ${{ inputs.promoted_sha || '' }}
    steps:
      # THE SCRIPT BELOW IS THE CHECKOUT, SO IT CANNOT COME FROM THE CHECKOUT.
      # T-0232 replaced actions/checkout with .github/chicago-4d-clone.sh, which
      # does `git init .` in an empty workspace and fetches from there. But the
      # script lives IN the repository, and nothing had put it on disk yet — so
      # every run died on its first step with
      #
      #   .github/chicago-4d-clone.sh: No such file or directory   (exit 127)
      #
      # It has never worked: the script and the step that calls it arrived in the
      # same commit (#1372). Measured 2026-09-18: the last 30 deploy runs on main
      # had all failed, the first at 2026-09-17T15:22Z — the promotion that carried
      # that commit to main — and the dev job is `skipped` by design and defers to
      # main's, so NOTHING had published for eleven hours. The owner found it by
      # looking at the app: no What's-New entries, while the changelog on dev was
      # being written normally.
      #
      # So fetch the one file over the API first, with the token this job already
      # holds. It lands in RUNNER_TEMP and NOT in the workspace, deliberately: the
      # script's `git init .` + checkout would refuse to overwrite an untracked
      # copy of a path that main also tracks.
      - name: Fetch the clone script (it is the checkout, so it predates the checkout)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/.github/chicago-4d-clone.sh?ref=${{ github.sha }}" \
            -o "$RUNNER_TEMP/chicago-4d-clone.sh"
          chmod +x "$RUNNER_TEMP/chicago-4d-clone.sh"
      - name: Checkout publisher and branch references
        # T-0232 — the bounded, retried partial clone from
        # .github/chicago-4d-clone.sh, same as promote-to-prod. The
        # actions/checkout this replaced had no filter and no bound: this job
        # has no timeout by design, so one slow draw could sit in checkout for
        # hours while every other tenant's deploy waited. Fetches dev in the
        # same bounded call so the preview step's fetch below is a no-op
        # freshness check.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/chicago-4d-clone.sh" main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the promotion and publication controls
        run: python3 .github/test_preserve_dev_only.py
      # The job runs only for an owner promotion (see its `if:`); this proves the
      # dispatch names a real one before any bytes are built.
      - name: Validate an explicit owner promotion
        if: env.DELIVERY_MODE == 'production'
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9]+', os.environ['PROMOTION_RUN_ID'])
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['PROMOTED_SHA'])
          PY
          gh run download "$PROMOTION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "owner-promotion-$PROMOTION_RUN_ID" --dir "$RUNNER_TEMP/owner-promotion"
          python3 .github/preserve_dev_only.py promotion-authority \
            --promotion-run "$PROMOTION_RUN_ID" --expected-sha "$PROMOTED_SHA" \
            --receipt "$RUNNER_TEMP/owner-promotion/promotion-receipt.json"
          git checkout --detach "$PROMOTED_SHA"
      - name: Publish the Prairie Avenue research browser into the artifact
        if: env.DELIVERY_MODE == 'production'
        run: |
          out="$RUNNER_TEMP/prairie-1904"
          rm -rf "$out"
          if python3 chicago/prairie_1904_v1/tools/publish.py "$out"; then
            rm -rf site/prairie-1904 && mv "$out" site/prairie-1904
          else
            echo "::warning::Prairie 1904 publish failed — /prairie-1904/ serves the committed copy in this deploy"
          fi
      # BUILD THE 4D MIRROR BEFORE ANYTHING READS site/ (T-0938). `site/4d/`
      # is untracked and .gitignored — a generated tree with one writer,
      # `chicago/4d/tools/publish.sh` — so the checkout above does not contain it and
      # the artifact would ship a 4D-shaped hole: no /4d/, no
      # /4d/js/changelog.js (which Manager and the polecat.live launcher parse),
      # no /4d/tickets.json. publish.sh also runs `ticket.mjs board`, so it
      # subsumes the separate board step this workflow used to carry for T-0937.
      #
      # NOT FATAL, and that is fleet doctrine rather than laziness: deploy is ungated on
      # purpose (see chicago-4d-promote-to-prod.yml — a hard test gate on deploy once
      # froze a fleet site for ~21 hours). A publish that fails must cost the 4D app,
      # not every other tenant in this monorepo. The `[ -f ]` guards downstream — the
      # stamp step, and the dev preview's own check — already read as "no gate to stamp,
      # skipping", so a missed publish degrades rather than deploying a lie.
      - name: Publish the 4D mirror into the artifact (site/4d is generated)
        if: env.DELIVERY_MODE == 'production'
        run: |
          (cd chicago/4d && bash tools/publish.sh) \
            || echo "::warning::4D publish failed — /chicago/4d/ will be missing or stale in this deploy"
      - name: Sanity-check JS parses
        run: |
          set -e
          # `node --check` parses a bare .js as CommonJS, so any ES module
          # (top-level import/export) fails spuriously. Parse each file as a
          # module instead — the Joliet game bundle under site/joliet/app/ is
          # ESM, and its Babylon chunk is several MB, so this also keeps the
          # check off stdin size limits by pointing at the file directly.
          #
          # WALKS THE TREE, NOT THE INDEX (T-0938). This was `git ls-files 'site/**/*.js'`,
          # which enumerates what is COMMITTED — and the whole of site/4d/ is
          # generated now, so the 4D renderer's modules would have dropped straight out of
          # the check that exists to stop a syntax error shipping as a blank page. `find`
          # asks the tree that is about to be uploaded, which is the tree the question is
          # about. It runs after the publish above for the same reason.
          fail=0
          for f in $(find site -name '*.js' -type f | sort); do
            if ! node --input-type=module --check < "$f" >/dev/null 2>&1; then
              # Fall back to script parsing for genuine classic scripts.
              if ! node --check "$f" >/dev/null 2>&1; then
                echo "SYNTAX FAIL: $f"; fail=1
              fi
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "JS OK"
      # Restamp the 4D Chicago gate with the commit that is ACTUALLY being
      # deployed. tools/publish.sh writes a stamp too, but it runs before the
      # commit it belongs to exists, so `git rev-parse HEAD` there names the
      # PARENT — and the stamp went live reading one commit behind itself. The
      # point of the stamp is to answer "which build am I looking at", so being
      # off by one defeats it entirely and, worse, sends whoever is debugging
      # after the wrong commit. Here the answer is knowable, so it is written
      # here. Central Time, matching every other date in the project.
      - name: Stamp the deployed build
        if: env.DELIVERY_MODE == 'production'
        run: |
          set -e
          f=site/4d/walk/index.html
          [ -f "$f" ] || { echo "no gate to stamp, skipping"; exit 0; }
          SHORT="$(git rev-parse --short=7 HEAD)"
          WHEN=$(TZ=America/Chicago date +"%b %-d, %Y, %-I:%M %p CT")
          python3 - "$f" "build $SHORT · $WHEN" <<'PY'
          import re, sys, pathlib
          p, stamp = pathlib.Path(sys.argv[1]), sys.argv[2]
          s = p.read_text()
          # Matches both forms: the published one publish.sh already filled in,
          # and the source one that still carries `hidden` and the placeholder.
          # The rewrite drops `hidden`, so a tree that reached deploy without
          # being published still shows a true stamp rather than nothing.
          new, n = re.subn(
              r'<p class="gate-build" id="gate-build"[^>]*>.*?</p>',
              lambda m: f'<p class="gate-build" id="gate-build">{stamp}</p>', s, flags=re.S)
          if n == 0:
              # Nothing to rewrite is a real problem — the gate would show the
              # publish-time stamp, or the raw placeholder, and both lie.
              print("WARNING: no gate-build element found; stamp not applied")
          else:
              p.write_text(new)
              print(f"stamped: {stamp}")
          PY
          # The front doors (/4d/, /4d/<year>/) are copies of walk/index.html, so they
          # are re-written from the page just stamped rather than stamped one by one.
          node chicago/4d/tools/write_entry_pages.mjs site/4d
          # T-2947: the year packs list every file with its hash, and the stamp just
          # changed walk/index.html and every door. Without re-listing, every "Offline
          # copy" download stopped at the first page ("changed while downloading").
          if [ -f chicago/4d/tools/write_year_packs.mjs ]; then
            node chicago/4d/tools/write_year_packs.mjs site/4d
            node chicago/4d/tools/write_year_packs.mjs --check site/4d \
              || echo "::warning::year packs do not match the stamped site — offline copies will stop"
          fi
      # The 4D ticket board (T-0937, T-0030 — the URL Manager's queue card reads) needs
      # no step of its own: `tools/publish.sh` above runs `ticket.mjs board` and copies
      # the result to site/4d/tickets.json. One writer, one place it is run.

      # The dev preview moved to its own Pages site (dev.chicago.polecat.live,
      # kevinrhaas/chicago-dev) on 2026-11-13. The old /4d/dev/ addresses stay
      # answerable: small pages that send a visitor on with the rest of the path, a
      # root 404 page that does the same for deeper links, and a service worker that
      # unregisters the old preview's offline copy.
      - name: Point /4d/dev/ at the dev preview's own site
        run: node .github/chicago-4d-dev-redirect.mjs site

      - name: Require one fresh Pages upload
        run: python3 .github/preserve_dev_only.py fresh-upload

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          # Kept for 90 days so a release's exact bytes can be re-inspected; the
          # action's default is 1 day.
          retention-days: 90
      - id: deployment
        uses: actions/deploy-pages@v4

      # T-0968 — a green deploy is not proof the site is reachable: /4d/dev/
      # served a 404 for hours while every deploy reported success (found by the owner
      # opening the page). This requests the LIVE origin for the URL list in
      # .github/chicago-4d-url-check.json and records what it returns.
      #
      # LOUD, NOT BLOCKING, and the reasoning is deliberate: a hard gate on a deploy
      # step once froze this site ~21 hours (chicago/4d/CLAUDE.md), and #1030 made a
      # 4D step fatal until #1031 reverted it. A URL smoke that can freeze the
      # monorepo's deploy is a worse bug than the one it detects. The step retries
      # over a bounded window because Pages serves the new artifact seconds after the
      # API reports success, asserts a BODY signal because a stale preview can return
      # 200 with nothing in it, and never fails this job. Its --self-test (run by
      # chicago/4d's tools/check.sh) points the same code at a fixture origin with a
      # URL known to 404 and proves the ::error:: annotation fires.
      - name: URL smoke — the deployed origin must answer (non-blocking, T-0968)
        run: |
          node .github/chicago-4d-url-check.mjs \
            --origin "${{ steps.deployment.outputs.page_url }}" \
            || echo "::warning::T-0968 URL smoke crashed — the deploy is unaffected; fix the checker"
